name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/inbox-session.test.mjs'
      - 'scripts/address-qr.test.mjs'
      - 'scripts/email-fixtures.test.ts'
      - 'scripts/seo-check.mjs'
      - 'scripts/seo-rankings.test.mjs'
      - 'scripts/seo-dashboard.test.mjs'
      - 'scripts/lib/**'
      - '.github/workflows/deploy-frontend.yml'

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify SEO output
        run: npm run check:seo

      - name: Verify inbox session continuity
        run: npm run test:inbox

      - name: Install mail-processing test dependencies
        run: npm ci --prefix workers/inboxfornow-api

      - name: Verify published email examples against the receiving handler
        run: npm run test:mail-fixtures

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.94.0'
          command: pages deploy dist --project-name=inboxfornow --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
